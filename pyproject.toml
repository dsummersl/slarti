[project]
name = "slarti"
version = "0.1.0"
description = "A coordination CLI for validated architecture documentation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Dane Summers", email = "dsummersl@gmail.com" }
]
license = "Apache-2.0"
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]
dependencies = [
  "typer>=0.27",
  "linkml-runtime>=1.11.1",
  "rdflib>=7.6",
  "pyyaml>=6.0.3",
  "tomli-w>=1.2",
]

[project.scripts]
slarti = "slarti.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slarti"]

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-cov>=7.1",
  "ruff>=0.16",
  "mypy>=2.3",
  "pre-commit>=4.6",
  "radon>=6.0.1",
  "treepeat>=0.8.0",
  "vulture>=2.16",
  "types-PyYAML>=6.0.12",
  # slarti dogfoods itself (I13): the delegated tools are the *user's* pinned versions.
  "linkml>=1.11,<2",
  "pyshacl>=0.40",
]

[tool.ruff]
line-length = 100
exclude = [".venv", ".git", "build", "dist"]
lint.select = [
  "E",   # pycodestyle
  "F",   # Pyflakes
  "I",   # isort (automatically sorts and moves imports to top)
  "B",   # flake8-bugbear (find likely bugs and design problems in your program)
  "PLR", # Pylint Refactor (specifically catches misplaced imports)
  "PLC", # Pylint Convention (specifically catches imports not at the top of the file)
  "TID", # Tidy imports
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["PLR2004"] # Allow magic numbers in tests

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["slarti"]

[[tool.mypy.overrides]]
module = ["linkml_runtime.*"]
ignore_missing_imports = true

[tool.vulture]
# typer registers these as commands; vulture cannot see the decorator.
ignore_names = ["doctor", "docs_command", "report_command"]

[tool.pytest.ini_options]
addopts = "--cov=slarti  --cov-report=term-missing"
